name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  repository_dispatch:
    types: [ nurture-updated ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

permissions:
  contents: read

jobs:
  dag-enforce:
    name: The Sovereign Verifier (DAG Enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Enforce Hexagonal DAG
        run: python3 scripts/enforce_dag.py

  test:
    name: Test & Lint
    needs: [dag-enforce]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Protobuf Compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Lint)
        run: cargo clippy --workspace -- -D warnings

      - name: Start Test Database
        run: |
          docker-compose -f docker-compose.test.yml up -d
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10
          
      - name: Run Tests (SQLite Backend)
        env:
          DATABASE_URL: postgres://aiome_test_user:aiome_test_password@localhost:5433/aiome_test_db
        run: cargo test --workspace

      - name: Run Tests (PostgreSQL Backend)
        env:
          DATABASE_URL: postgres://aiome_test_user:aiome_test_password@localhost:5433/aiome_test_db
          TEST_POSTGRES_URL: postgres://aiome_test_user:aiome_test_password@localhost:5433/aiome_test_db
        run: cargo test --workspace -- --test-threads=1

      - name: Verify Release Build (Phase γ)
        run: cargo build --release --workspace

      - name: Stop Test Database
        if: always()
        run: docker-compose -f docker-compose.test.yml down

      - name: Code Coverage
        run: |
          if ! command -v cargo-tarpaulin &> /dev/null; then
            cargo install cargo-tarpaulin --locked
          fi
          cargo tarpaulin --out Xml --workspace --exclude-files "*/tests/*"
          
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/management-console
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: NPM Audit (Critical Vulnerabilities)
        run: npm audit --audit-level=critical
      - name: NPM Signature Verification
        run: npm audit signatures || true
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (Vite Dev Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/management-console
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: NPM Audit (Critical Vulnerabilities)
        run: npm audit --audit-level=critical
      - name: NPM Signature Verification
        run: npm audit signatures || true
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test

  audit:
    name: Industrial Security Audit (Bastion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (pip-audit, bandit)
        run: pip install pip-audit bandit

      # Layer 1: cargo audit
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Layer 2: cargo deny
      - name: Run cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi
          cargo deny check

  docs:
    name: Generate Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Generate Wiki
        run: python3 scripts/generate_docs.py
        
      - name: Generate Architecture Map
        run: python3 scripts/generate_architecture.py

      - name: Check for changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ ARCHITECTURE.md
          git diff --staged --quiet || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git commit -m "docs: auto-generate CODE Wiki & Architecture Map [skip ci]"
          git push

  docs-sync:
    name: Documentation Sync Check
    runs-on: ubuntu-latest
    # 警告のみ — CI をブロックしない
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # HEAD~1 との比較に必要

      - name: Run docs-sync check
        run: bash scripts/docs-sync-check.sh --ci

  pattern-check:
    name: Anti-Pattern Enforcer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pattern enforcer
        run: bash scripts/pattern-enforcer.sh --ci

  deep-scan:
    name: Segmented Deep Scan
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Run segmented deep scan
        run: bash scripts/deep-scan.sh --ci

  license-header:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers (BSL-1.1 or Apache-2.0)
        run: |
          MISSING=$(find . -name "*.rs" -not -path "*/target/*" -not -path "./apps/samsara-hub/src/hub_ws_tests.rs" \
            -exec sh -c 'grep -q "Licensed under the Business Source License" "$1" || grep -q "Licensed under the Apache License" "$1" || echo "$1"' _ {} \;)
          if [ -n "$MISSING" ]; then
            echo "❌ Missing license header in:"
            echo "$MISSING"
            exit 1
          fi

  forbid-unsafe:
    name: Forbid Unsafe Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure #![forbid(unsafe_code)] or #![deny(unsafe_code)] in main.rs/lib.rs
        run: |
          for file in apps/api-server/src/main.rs apps/samsara-hub/src/main.rs apps/watchtower/src/main.rs apps/key-proxy/src/main.rs libs/core/src/lib.rs libs/shared/src/lib.rs libs/infrastructure/src/lib.rs; do
            if ! grep -qE "#!\[(forbid|deny)\(unsafe_code\)\]" "$file"; then
              echo "❌ Critical: $file is missing safety annotations (![forbid/deny(unsafe_code)])"
              exit 1
            fi
          done

  semver-check:
    name: API Compatibility (semver)
    runs-on: ubuntu-latest
    # 警告のみ — 破壊的変更を検出するが CI はブロックしない
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴が必要（タグとの比較）

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler && cargo install cargo-semver-checks --locked

      - name: Check API compatibility
        run: |
          # ライブラリクレートのみチェック（binは対象外）
          for crate in libs/core libs/shared libs/aiome-contracts; do
            if [[ -f "$crate/Cargo.toml" ]]; then
              echo "🔍 Checking $crate..."
              cargo semver-checks check-release \
                --manifest-path "$crate/Cargo.toml" 2>&1 || true
            fi
          done

  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly required for udeps)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Protobuf Compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Check unused dependencies
        run: cargo +nightly udeps --workspace 2>&1 || true

  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # PR のコミットメッセージを検証
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          ERRORS=0
          # PR 内の全コミットを検証
          COMMITS=$(git log --pretty=%s origin/${{ github.base_ref }}..HEAD 2>/dev/null || true)
          if [[ -z "$COMMITS" ]]; then
            echo "ℹ️  No commits to check"
            exit 0
          fi
          while IFS= read -r msg; do
            [[ -z "$msg" ]] && continue
            if ! bash scripts/check-commit-msg.sh "$msg" 2>/dev/null; then
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$COMMITS"
          if [[ $ERRORS -gt 0 ]]; then
            echo ""
            echo "❌ $ERRORS commit(s) do not follow Conventional Commits format."
            exit 1
          fi
          echo "✅ All commits follow Conventional Commits."

  sbom:
    name: SBOM Generation (CycloneDX)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --output-cdx 2>&1 || true
          if [[ -f bom.json ]]; then
            echo "✅ SBOM generated: bom.json"
            echo "📊 Dependencies: $(jq '.components | length' bom.json 2>/dev/null || echo 'unknown')"
          fi

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "*.cdx.json"
          retention-days: 90
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Distroless Image
        run: |
          docker build -t aiome-api:latest -f docker/distroless.Dockerfile --build-arg BIN_NAME=api-server .
      - name: Build Samsara Hub Image
        run: |
          docker build -t aiome-hub:latest -f docker/distroless.Dockerfile --build-arg BIN_NAME=samsara-hub .

      - name: Run Trivy vulnerability scanner (api-server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aiome-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (samsara-hub)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'aiome-hub:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  trigger-nurture:
    name: Trigger Nurture CI
    needs: [test, frontend, e2e, audit, license-header, forbid-unsafe, docs-sync, pattern-check, deep-scan, semver-check, unused-deps, sbom, docker-build]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - name: repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AIOME_DISPATCH_TOKEN }}
          repository: motivationstudio-llc/project-nurture
          event-type: oss-updated
