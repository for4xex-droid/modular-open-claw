name: Formal Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Enable extism support
      run: |
        # get.extism.org/cli の -b オプション廃止に追従。pip パッケージ extism-cli は存在しない (CI修繕 2026-07-04)
        curl -sL https://get.extism.org/cli | sh -s -- -y -o /usr/local/bin
        sudo env "PATH=$PATH" extism lib install --prefix /usr/local
        
    - name: Download TLC Tools
      run: curl -L -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      
    - name: Run TLC Model Checker (AiomeQuarantineProtocol)
      run: |
        if [ -f specs/AiomeQuarantineProtocol.tla ]; then
          java -cp tla2tools.jar tlc2.TLC specs/AiomeQuarantineProtocol.tla -modelcheck -deadlock -workers auto -config specs/AiomeQuarantineProtocol.cfg
        else
          echo "⚠️  spec file not found, skipping TLC."
        fi

    - name: Run TLC Model Checker (NurtureEconomyProtocol)
      working-directory: commercial
      run: |
        if [ ! -f specs/NurtureEconomyProtocol.tla ]; then
          echo "🚨 commercial/specs/NurtureEconomyProtocol.tla missing"
          exit 1
        fi
        java -cp ../tla2tools.jar tlc2.TLC specs/NurtureEconomyProtocol.tla \
          -modelcheck -deadlock -workers auto \
          -config specs/NurtureEconomyProtocol.cfg

    - name: Ensure Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Run Model-Based Tests (Quarantine Protocol)
      run: cargo test -p infrastructure --test mbt_quarantine

    - name: Run OxiLean Kernel Tests
      run: cargo test --manifest-path vendor/oxilean-kernel/Cargo.toml
