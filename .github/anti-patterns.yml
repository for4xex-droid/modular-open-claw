# Aiome Anti-Patterns Configuration
# Used by scripts/pattern-enforcer.sh to prevent regression of critical security/economic bugs.

patterns:
  - id: hardcoded-economic-context
    description: "Manual construction of EconomicContext with hardcoded values is forbidden. Use CommerceEngine."
    pattern: "EconomicContext \\{.*spent_today:.*daily_limit:.*\\}"
    severity: error
    files: ["apps/api-server/src/**/*.rs"]

  - id: insecure-exec
    description: "Direct std::process::Command use without BastionGuard is restricted."
    pattern: "std::process::Command::new"
    severity: warning
    files: ["libs/**/*.rs", "apps/**/*.rs"]

  - id: missing-is-system-internal
    description: "Check if safe_exec calls should include is_system_internal flag for privileged commands."
    pattern: "safe_exec\\(.*false\\)"
    severity: warning
    files: ["libs/infrastructure/src/**/*.rs"]

  - id: large-payload-bypass
    description: "RequestBodyLimitLayer should be tuned per-route, global 512MB is a temporary fix."
    pattern: "RequestBodyLimitLayer::new\\(512"
    severity: warning
    files: ["apps/api-server/src/main.rs"]

  - id: env-after-scrub
    description: "Calling std::env::var in internal_services or NAPI Bridge after scrub_env has executed leads to silent failures."
    pattern: "std::env::var\\("
    severity: error
    files: ["apps/api-server/src/internal_services/**/*.rs", "libs/napi-bridge/src/**/*.rs"]

  - id: raw-client-new
    description: "Do not instantiate raw reqwest::Client::new() in production code. Use the injected AppState::http_client."
    pattern: "reqwest::Client::new\\(\\)"
    severity: warning
    files: ["apps/api-server/src/**/*.rs", "libs/**/*.rs"]

  - id: missing-auth-extractor
    description: "API Handlers must use Type-Driven Security via Authenticated extractor. (If caught here loosely, verify manually, or rely on deep-scan CC-6)"
    pattern: "pub async fn .*(State<AppState>) *[)] *->"
    severity: warning
    files: ["apps/api-server/src/routes/**/*.rs"]
