[package]
name = "aiome-interface"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
tracing = "0.1"
