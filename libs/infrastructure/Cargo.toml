[package]
license = "Apache-2.0"
name = "infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
aiome_core = { path = "../core", package = "aiome-core" }
soul = { path = "../soul" }
aiome-contracts = { workspace = true }
# tuning = { path = "../tuning" } (Moved to commercial repo)
shared = { path = "../shared" }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
reqwest = { workspace = true }
stripe = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
bastion = { package = "bastion-core", git = "https://github.com/for4xex-droid/bastion.git", branch = "main", features = ["net", "fs"] }
chrono.workspace = true
url = "2.5"
html-escape = "0.2"
regex = "1.12.3"
async-recursion = "1.1.1"
unicode-normalization = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
extism = "1.13.0"
extism-convert = "1.13.0"
wasi = "0.14.7"
tokio-util = { workspace = true, features = ["codec", "io"] }
secrecy = { version = "0.8.0", features = ["serde"] }
jsonschema = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "rand_core"] }
base64 = "0.22"
rand = "0.8"
contracts = "0.6.7"
serde_yaml = "0.9"
automerge = { workspace = true }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "http"] }
teloxide = { version = "0.13", features = ["macros"] }
once_cell = { workspace = true }
tokio-stream = "0.1"
jsonwebtoken = "9.3.1"
zeroize = "1.8.1"
aes-gcm = "0.10.3"
governor = { version = "0.6", features = ["dashmap"] }
ammonia = "4.1.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
futures = "0.3"
proptest.workspace = true

