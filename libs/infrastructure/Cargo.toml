[package]
license = "BUSL-1.1"
name = "infrastructure"
version = "1.0.0"
edition = "2021"

[dependencies]
aiome_core = { path = "../core", package = "aiome-core" }
soul = { path = "../soul" }
biome-engine = { path = "../biome-engine" }
aiome-core-contracts = { workspace = true }
aiome-contracts = { workspace = true }
# tuning = { path = "../tuning" } (Moved to commercial repo)
shared = { path = "../shared" }
sqlx = { workspace = true, features = ["sqlite", "postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
tonic = { workspace = true, optional = true }
tonic-health = { version = "0.12", optional = true }
reqwest = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
async-stream = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
utoipa = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
bastion = { package = "bastion-core", version = "1.0.0", features = ["net", "fs"] }
chrono.workspace = true
url = "2.5"
html-escape = "0.2"
regex = "1.12.3"
async-recursion = "1.1.1"
unicode-normalization = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
extism = "1.21.0"
extism-convert = "1.21.0"
wasi = "0.14.7"
tokio-util = { workspace = true, features = ["codec", "io"] }
secrecy = { version = "0.8.0", features = ["serde"] }
jsonschema = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "rand_core"] }
base64 = "0.22"
rand = "0.8"
contracts = "0.6.7"
serde_yaml = "0.9"
automerge = { workspace = true }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "http"] }
teloxide = { version = "0.13", features = ["macros"] }
once_cell = { workspace = true }
tokio-stream = "0.1"
jsonwebtoken = "9.3.1"
zeroize = "1.8.1"
aes-gcm = "0.10.3"
governor = { version = "0.6", features = ["dashmap"] }
ammonia = "4.1.2"
dashmap = "5.5"
parking_lot = "0.12"
libc = "0.2"
lru.workspace = true
minijinja = "2.0"
walkdir = "2.4"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3"

# Native Inference (Phase 2)
candle-core = { version = "0.8.0", optional = true }
candle-nn = { version = "0.8.0", optional = true }
candle-transformers = { version = "0.8.0", optional = true }
hf-hub = { version = "0.4.0", optional = true }
tokenizers = { version = "0.21.0", optional = true }
pdf-extract = "0.10.0"
html2md = "0.2.15"
hkdf = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"

# S3 Integration (RTBF Purge)
aws-config = { version = "1.5.0", optional = true }
aws-sdk-s3 = { version = "1.65.0", optional = true }
metrics.workspace = true

[features]
test-utils = []
grpc = ["tonic", "aiome-core-contracts/grpc", "tonic-health"]
native-inference = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "tokenizers"]
s3 = ["aws-config", "aws-sdk-s3"]

[dev-dependencies]
filetime = "0.2"
futures = "0.3"
proptest.workspace = true
dotenvy.workspace = true
wiremock.workspace = true
serial_test = { workspace = true }

[lints]
workspace = true
