[package]
name = "avatar-engine"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
authors = ["motivationstudio LLC <motivationstudio.llc@gmail.com>"]
description = "Aiome physical manifestation and 2D asset routing engine (Inochi2D & VRM compatible)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
aiome-core-contracts = { path = "../aiome-core-contracts" }
async-trait = "0.1"
rubato = "0.16"
anyhow = "1.0"
gltf = { version = "1.4.1", features = ["extensions", "extras"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
