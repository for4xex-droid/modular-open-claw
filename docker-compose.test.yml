services:
  db:
    image: postgres:17-alpine
    container_name: aiome-db-test
    environment:
      POSTGRES_DB: aiome_test_db
      POSTGRES_USER: aiome_test_user
      POSTGRES_PASSWORD: aiome_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiome_test_user -d aiome_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiome-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
