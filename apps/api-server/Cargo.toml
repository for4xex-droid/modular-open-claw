[package]
license = "BUSL-1.1"
name = "api-server"
version = "1.0.0"
edition = "2021"

[dependencies]
aiome_core = { path = "../../libs/core", package = "aiome-core" }
soul = { path = "../../libs/soul" }
infrastructure = { path = "../../libs/infrastructure", features = ["grpc"] }
shared = { path = "../../libs/shared" }
avatar-engine = { path = "../../libs/avatar-engine" }
aiome-core-contracts = { path = "../../libs/aiome-core-contracts", features = ["axum", "grpc"] }
aiome-contracts = { path = "../../libs/aiome-contracts" }
aiome-commerce = { path = "../../libs/aiome-commerce" }
biome-engine = { path = "../../libs/biome-engine" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tonic = { workspace = true }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header", "limit", "timeout"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow.workspace = true
regex = "1.10"
subtle = "2.5.0"
tower = { version = "0.4", features = ["limit", "util", "buffer"] }
futures = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = "0.28.0"
futures-util = "0.3.32"
url = "2.5.8"
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
sqlx.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
ed25519-dalek = "2.1"
base64 = "0.22"
mime_guess = "2.0"
bastion = { package = "bastion-core", version = "1.0.0", features = ["net", "fs"] }
utoipa.workspace = true
utoipa-swagger-ui = { version = "8", features = ["axum"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
dotenvy = "0.15"
sysinfo = "0.33"
# OP-088 P0-pre: default-features 禁止（cloud-storage/AWS を Desktop InProcess に引き込まない）
nurture-api = { path = "../../commercial/apps/nurture-api", optional = true, default-features = false }
nurture-core = { path = "../../commercial/libs/nurture-core", optional = true }
nurture-infra = { path = "../../commercial/libs/nurture-infra", optional = true, default-features = false }
commerce-protocol = { path = "../../commercial/libs/commerce-protocol", optional = true }
secrecy.workspace = true
stripe.workspace = true
once_cell.workspace = true
rand = "0.8"
zeroize = "1.8.1"
hmac = "0.12.1"
sha2.workspace = true
hex = "0.4.3"
tempfile = "3.27.0"
moka = { version = "0.12.15", features = ["future"] }
async-stripe-webhook = { version = "1.0.0-rc.5", features = ["deserialize", "full", "serialize"] }
async-stripe-core = { version = "1.0.0-rc.5", features = ["deserialize", "full", "serialize"] }
async-stripe-checkout = { version = "1.0.0-rc.5", features = ["deserialize", "full", "serialize"] }
argon2 = "0.5.3"


[features]
default = []  # SEC: dev-routes must be explicitly opted-in via --features dev-routes
dev-routes = []
# Quick Start release images only — never enable on production compose.
dev-mock = ["aiome-commerce/dev-mock", "infrastructure/dev-mock"]
# Desktop / Tauri InProcess 正本: stripe のみ（nurture-api `desktop` = no AWS）
nurture = [
    "dep:nurture-api",
    "dep:nurture-core",
    "dep:nurture-infra",
    "dep:commerce-protocol",
    "aiome_core/nurture",
    "nurture-api/desktop",
    "nurture-infra/stripe",
]
# サーバ側 InProcess で S3 資産が必要なときのみ（Desktop ビルドでは使わない）
nurture-cloud = ["nurture", "nurture-api/cloud-storage", "nurture-infra/cloud-storage"]
demo = []

[dev-dependencies]
axum-test = "16"
tempfile = "3.27.0"
wiremock = { workspace = true }
serial_test = "3"
infrastructure = { path = "../../libs/infrastructure", features = ["test-utils"] }

[lints]
workspace = true
