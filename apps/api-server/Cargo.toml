[package]
license = "BUSL-1.1"
name = "api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
aiome_core = { path = "../../libs/core", package = "aiome-core" }
soul = { path = "../../libs/soul" }
infrastructure = { path = "../../libs/infrastructure", features = ["grpc"] }
shared = { path = "../../libs/shared" }
avatar-engine = { path = "../../libs/avatar-engine" }
aiome-core-contracts = { path = "../../libs/aiome-core-contracts", features = ["axum"] }
aiome-commerce = { path = "../../libs/aiome-commerce" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header", "limit", "timeout"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow.workspace = true
regex = "1.10"
subtle = "2.5.0"
tower = { version = "0.4", features = ["limit", "util", "buffer"] }
futures = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = "0.28.0"
futures-util = "0.3.32"
url = "2.5.8"
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
nix.workspace = true
sqlx.workspace = true
ed25519-dalek = "2.1"
base64 = "0.22"
mime_guess = "2.0"
bastion = { package = "bastion-core", version = "1.0.0", features = ["net", "fs"] }
utoipa.workspace = true
utoipa-swagger-ui = { version = "8", features = ["axum"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
dotenvy = "0.15"
sysinfo = "0.33"
nurture-api = { path = "../../../ProjectーNurture/apps/nurture-api", optional = true }
nurture-core = { path = "../../../ProjectーNurture/libs/nurture-core", optional = true }
nurture-infra = { path = "../../../ProjectーNurture/libs/nurture-infra", optional = true }
commerce-protocol = { path = "../../../ProjectーNurture/libs/commerce-protocol", optional = true }
secrecy.workspace = true
stripe.workspace = true
once_cell.workspace = true
rand = "0.8"
zeroize = "1.8.1"
hmac = "0.12.1"
sha2.workspace = true
hex = "0.4.3"
tempfile = "3.27.0"

[features]
default = ["dev-routes"]
dev-routes = []
nurture = ["dep:nurture-api", "dep:nurture-core", "dep:nurture-infra", "dep:commerce-protocol", "aiome_core/nurture"]

[dev-dependencies]
axum-test = "16"
tempfile = "3.27.0"
wiremock = { workspace = true }
serial_test = "3"
