server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ──
    # React + Three.js bundle is ~12MB uncompressed; gzip reduces to ~2MB.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/otf
        font/ttf
        application/font-woff
        application/font-woff2;

    # ── Security Headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API Reverse Proxy ──
    # ^~ ensures this prefix match takes priority over regex location blocks,
    # preventing /api/v1/xxx.json from accidentally matching the static asset cache rule.
    location ^~ /api/ {
        proxy_pass http://api-server:3015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to support Server-Sent Events (SSE) streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400; # Prevent timeouts on long-lived connections
    }

    # ── SPA Routing ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static Asset Caching ──
    # Includes project-specific types: .vrm (3D avatar), .otf (custom font), .wasm (skills)
    # IMPORTANT: Nginx's add_header in a child block REPLACES (not appends to)
    # all add_header directives from the parent server block. We must repeat
    # security headers here to prevent them from being silently dropped.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|vrm|wasm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
