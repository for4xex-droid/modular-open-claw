[advisories]
# =====================================================================
# RUSTSEC Ignores (Chesterton's Fence)
# =====================================================================
# The following Wasmtime vulnerabilities cannot be patched yet because
# the current `extism` crate (v1.21.0) strictly pins `wasi-common` v41.x.
# Attempting to bump workspace wasmtime to v43+ handles the root vulnerabilities
# but does not resolve the extism tree's dependency.
# Monitor `extism` updates and remove these ignores when they upgrade wasmtime.
