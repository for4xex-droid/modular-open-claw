# WARNING: This docker-compose file is intended specifically for local quickstart and
# zero-configuration demonstration purposes. It omits critical container security options
# (like IPC_LOCK, read-only rootfs) to maximize startup speed and compatibility.
# For any production-facing or remote deployments, you MUST use `docker-compose.production.yml`.

# =====================================================================
# 🍎 macOS USERS:
# Native Ollama installation is HIGHLY recommended for performance.
# If using native Ollama on macOS:
# 1. Comment out the 'ollama:' block below.
# 2. In 'api-server', set: OLLAMA_HOST: "http://host.docker.internal:11434"
# =====================================================================

services:
  ollama:
    image: ollama/ollama
    container_name: aiome-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # ollama CLI is guaranteed to exist; curl is NOT included in the minimal Ubuntu base.
      # `ollama list` connects to the server and succeeds even with zero models pulled.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Note: For GPU support, you should run this using docker compose up with --gpus=all flag on Linux.
    # On Mac, native Ollama installation is recommended instead of using this container.

  api-server:
    # Use the pre-built image to save 10+ minutes of build time
    image: ghcr.io/motivationstudio-llc/aiome:v1.0.0
    container_name: aiome-api-server
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: api-server
        # Opt-in Mock for empty Stripe; production compose must never set this.
        FEATURES: dev-mock
    ports:
      - "3015:3015"
    environment:
      CELL_ID: "quickstart"
      AIOME_DEV_MODE: "1"
      OLLAMA_HOST: "http://ollama:11434"
      # For Mac native Ollama, use: OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "gemma4:e4b"  # Gemma4 — multimodal, ~6GB RAM
      RUST_LOG: "info,aiome=debug"
      WORKSPACE_DIR: "/data"
      API_SERVER_SECRET: "aiome_quickstart_demo_secret_2026"
      VAULT_MASTER_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      # JWT key for auth (release builds require this; generate your own for production)
      JWT_PRIVATE_KEY_B64: "MC4CAQAwBQYDK2VwBCIEIO5u8FRMowHdVD/soQOD6TivIP1Ovb6Wm161FW6NmkYK" # gitleaks:allow
      # Optionals:
      # STRIPE_API_KEY: "" # Leave empty for automatic mock mode capability
    volumes:
      - aiome_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3015/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      ollama:
        condition: service_healthy

  management-console:
    image: ghcr.io/motivationstudio-llc/aiome-console:v1.0.0
    container_name: aiome-mc
    build:
      context: apps/management-console
      dockerfile: Dockerfile
    ports:
      - "1420:80"
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  ollama_data:
  aiome_data:
