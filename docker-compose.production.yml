version: '3.8'

services:
  # The Abyss Vault (Key Proxy)
  # Responsible for holding sensitive API keys in memory (locked).
  key-proxy:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: key-proxy
    environment:
      - KEY_PROXY_PORT=9999
      - VAULT_SECRET=${VAULT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    cap_add:
      - IPC_LOCK # REQUIRED for mlockall() security
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9999"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # The AIOME Command Center (Main Application)
  # No API keys in environment; communicates through the proxy.
  api-server:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: api-server
    environment:
      - KEY_PROXY_URL=http://key-proxy:9999
      - SAMSARA_HUB_REST=http://samsara-hub:3016
      - SAMSARA_HUB_WS=ws://samsara-hub:3016/api/v1/federation/ws
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - RURI_EMBED_URL=http://ruri-embed-server:8100
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - API_SERVER_SECRET=${API_SERVER_SECRET}
      - FEDERATION_SECRET=${FEDERATION_SECRET}
      - TIMESFM_AUTH_TOKEN=${TIMESFM_AUTH_TOKEN}
      - TIMESFM_SIDECAR_URL=http://timesfm-sidecar:3020
    depends_on:
      - key-proxy
      - samsara-hub
      - ruri-embed-server
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3015/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    ports:
      - "3015:3015"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  samsara-hub:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: samsara-hub
    environment:
      - PORT=3016
      - DATABASE_URL=sqlite:///app/data/samsara_hub.db
      - FEDERATION_SECRET=${FEDERATION_SECRET}
    volumes:
      - ./data/hub:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    ports:
      - "127.0.0.1:3016:3016"

  ruri-embed-server:
    # NOTE: This image is not publicly available on GHCR.
    # Build locally: docker build -t ruri-embed-server ./tools/ruri-embed-server
    # Or use any sentence-transformer compatible embedding server on port 8100.
    image: ruri-embed-server:latest
    restart: always
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        limits:
          memory: 2G

  timesfm-sidecar:
    build:
      context: ./apps/timesfm-sidecar
    restart: always
    environment:
      - TIMESFM_AUTH_TOKEN=${TIMESFM_AUTH_TOKEN}
    # RT3-7 FIX: No host port binding. Only accessible via Docker internal network.
    # Previous: ports: - "127.0.0.1:3020:3020"
    expose:
      - "3020"
    deploy:
      resources:
        limits:
          memory: 4G
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /root/.cache:size=2G
    security_opt:
      - no-new-privileges:true
