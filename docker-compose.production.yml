services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aiome
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=aiome
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiome"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-server
      - samsara-hub
    restart: always

  # The Abyss Vault (Key Proxy)
  # Responsible for holding sensitive API keys in memory (locked).
  # KEEP production.Dockerfile: healthcheck uses `nc` (distroless has no shell/nc).
  key-proxy:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: key-proxy
    environment:
      - KEY_PROXY_PORT=9999
      - BIND_ALL=true
      - VAULT_SECRET=${VAULT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
      - VAULT_MASTER_PASSWORD=${VAULT_MASTER_PASSWORD}
    cap_add:
      - IPC_LOCK # REQUIRED for mlockall() security
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    deploy:
      resources:
        limits:
          memory: 256M
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9999"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # The AIOME Command Center (Main Application)
  # No API keys in environment; communicates through the proxy.
  # MC (React) is served from api-server static — MUST use distroless (includes dist).
  # key-proxy / samsara-hub / shadow-worker stay on production.Dockerfile (curl/nc healthchecks).
  api-server:
    build:
      context: .
      dockerfile: docker/distroless.Dockerfile
      args:
        BIN_NAME: api-server
    environment:
      - CELL_ID=${CELL_ID:-cell-0}
      # Bind-mounted data volume; required so UID 65532 can write (DEV_MODE workspace under /app is not writable).
      - AIOME_DATA_DIR=/app/data
      - KEY_PROXY_URL=http://key-proxy:9999
      - VAULT_SECRET=${VAULT_SECRET}
      # Federation v1.5 activated
      - SAMSARA_HUB_REST=http://samsara-hub:3016
      - SAMSARA_HUB_WS=ws://samsara-hub:3016/api/v1/federation/ws
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - RURI_EMBED_URL=http://ruri-embed-server:8100
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # DEPRECATED: Legacy auth. Retained for backward compatibility during JWT migration.
      # Remove after confirming all clients use JWT auth (see ADR-019).
      - API_SERVER_SECRET=${API_SERVER_SECRET}
      - FEDERATION_SECRET=${FEDERATION_SECRET}
      - TIMESFM_AUTH_TOKEN=${TIMESFM_AUTH_TOKEN}
      - TIMESFM_SIDECAR_URL=http://timesfm-sidecar:3025
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - NURTURE_API_URL=http://nurture-api:3020
      - NURTURE_INTERNAL_SECRET=${NURTURE_INTERNAL_SECRET}
      # Stripe secrets (STRIPE_API_KEY / preferred STRIPE_WEBHOOK_SECRET) come from
      # key-proxy via fetch_and_inject_secrets — do NOT add STRIPE_API_KEY here.
      # Non-secrets below are Vault-excluded and required for production preflight.
      - STRIPE_TEST_MODE=${STRIPE_TEST_MODE:-false}
      - STRIPE_PRICE_SUBSCRIPTION_MONTHLY=${STRIPE_PRICE_SUBSCRIPTION_MONTHLY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GEO_OPTIMIZER_URL=http://geo-optimizer:8080
      - GEO_ENABLED=${GEO_ENABLED:-true}
      - SHADOW_CLONE_GRPC_HOST=shadow-worker
      - SHADOW_CLONE_GRPC_PORT=50051
      - AIOME_DB_PATH=postgres://aiome:${POSTGRES_PASSWORD}@postgres:5432/aiome
    depends_on:
      postgres:
        condition: service_healthy
      key-proxy:
        condition: service_healthy
      shadow-worker:
        condition: service_healthy
    volumes:
      - ./data/api:/app/data
      - ./data/api/intent_tmp:/app/.intent_tmp
      - ./apps/api-server/static:/app/apps/api-server/static:ro
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    # distroless nonroot = UID/GID 65532（production.Dockerfile の 1001 とは異なる）
    user: "65532:65532"
    # Distroless に curl/shell が無いため CMD curl healthcheck は不可。
    # 到達性は Caddy upstream / 外部監視で確認する。
    healthcheck:
      disable: true
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nurture-api:
    build:
      context: .
      dockerfile: commercial/docker/nurture.Dockerfile
    environment:
      - PORT=3020
      - NURTURE_BIND_ADDR=0.0.0.0
      - DATABASE_URL=postgres://aiome:${POSTGRES_PASSWORD}@postgres:5432/nurture
      - NURTURE_INTERNAL_SECRET=${NURTURE_INTERNAL_SECRET}
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - AIOME_API_URL=http://api-server:3015
    depends_on:
      postgres:
        condition: service_healthy
      key-proxy:
        condition: service_healthy
    volumes:
      - ./data/nurture:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  samsara-hub:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: samsara-hub
    environment:
      - PORT=3016
      - SAMSARA_BIND_ADDR=0.0.0.0
      - DATABASE_URL=postgres://aiome:${POSTGRES_PASSWORD}@postgres:5432/samsara_hub
      - FEDERATION_SECRET=${FEDERATION_SECRET}
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
      - CELL_ID=${CELL_ID:-cell-0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/hub:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  ruri-embed-server:
    # NOTE: This image is not publicly available on GHCR.
    # Build locally: docker build -t ruri-embed-server ./tools/ruri-embed-server
    # Or use any sentence-transformer compatible embedding server on port 8100.
    image: ruri-embed-server:v1.0.0-first-penguin
    restart: always
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        limits:
          memory: 2G

  timesfm-sidecar:
    build:
      context: ./apps/timesfm-sidecar
    restart: always
    environment:
      - TIMESFM_AUTH_TOKEN=${TIMESFM_AUTH_TOKEN}
    # RT3-7 FIX: No host port binding. Only accessible via Docker internal network.
    # Previous: ports: - "127.0.0.1:3020:3020"
    expose:
      - "3025"
    deploy:
      resources:
        limits:
          memory: 4G
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /home/appuser/.cache:size=2G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"

  geo-optimizer:
    build:
      context: apps/geo-optimizer
      dockerfile: Dockerfile
    deploy: { resources: { limits: { memory: 1G } } }
    security_opt: ["no-new-privileges:true"]
    user: "1001:1001"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/openapi.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  shadow-worker:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: shadow-worker
    environment:
      - CELL_ID=${CELL_ID:-cell-0}
      - A2A_AUTH_TOKEN=${A2A_AUTH_TOKEN}
      - SHADOW_CLONE_GRPC_PORT=50051
      - OXILEAN_PROOF_TIMEOUT_SECS=${OXILEAN_PROOF_TIMEOUT_SECS:-10}
      - OXILEAN_PROOF_SEMAPHORE_PERMITS=${OXILEAN_PROOF_SEMAPHORE_PERMITS:-1}
      - KEY_PROXY_URL=http://key-proxy:9999
      - VAULT_SECRET=${VAULT_SECRET}
    expose:
      - "50051"
    depends_on:
      - key-proxy
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/50051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

volumes:
  pg_data:
  caddy_data:
  caddy_config:
