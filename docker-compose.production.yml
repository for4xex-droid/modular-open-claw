
services:
  # The Abyss Vault (Key Proxy)
  # Responsible for holding sensitive API keys in memory (locked).
  key-proxy:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: key-proxy
    environment:
      - KEY_PROXY_PORT=9999
      - VAULT_SECRET=${VAULT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
    cap_add:
      - IPC_LOCK # REQUIRED for mlockall() security
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9999"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # The AIOME Command Center (Main Application)
  # No API keys in environment; communicates through the proxy.
  api-server:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: api-server
    environment:
      - KEY_PROXY_URL=http://key-proxy:9999
      - VAULT_SECRET=${VAULT_SECRET}
      # Federation v1.5 activated
      - SAMSARA_HUB_REST=http://samsara-hub:3016
      - SAMSARA_HUB_WS=ws://samsara-hub:3016/api/v1/federation/ws
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - RURI_EMBED_URL=http://ruri-embed-server:8100
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # DEPRECATED: Legacy auth. Retained for backward compatibility during JWT migration.
      # Remove after confirming all clients use JWT auth (see ADR-019).
      - API_SERVER_SECRET=${API_SERVER_SECRET}
      - FEDERATION_SECRET=${FEDERATION_SECRET}
      - TIMESFM_AUTH_TOKEN=${TIMESFM_AUTH_TOKEN}
      - TIMESFM_SIDECAR_URL=http://timesfm-sidecar:3025
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - NURTURE_API_URL=http://nurture-api:3020
      - NURTURE_INTERNAL_SECRET=${NURTURE_INTERNAL_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GEO_OPTIMIZER_URL=http://geo-optimizer:8080
      - GEO_ENABLED=${GEO_ENABLED:-true}
      - SHADOW_CLONE_GRPC_HOST=shadow-worker
      - SHADOW_CLONE_GRPC_PORT=50051
    depends_on:
      - key-proxy
      - ruri-embed-server
      - shadow-worker
    volumes:
      - ./data/api:/app/data
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3015/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    ports:
      - "3015:3015"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nurture-api:
    build:
      context: ../Project-Nurture
      dockerfile: Dockerfile
    environment:
      - PORT=3020
      - DATABASE_URL=sqlite:///app/data/nurture.db
      - NURTURE_INTERNAL_SECRET=${NURTURE_INTERNAL_SECRET}
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - AIOME_API_URL=http://api-server:3015
    depends_on:
      - key-proxy
    volumes:
      - ../Project-Nurture/data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  samsara-hub:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: samsara-hub
    environment:
      - PORT=3016
      - DATABASE_URL=sqlite:///app/data/samsara_hub.db
      - FEDERATION_SECRET=${FEDERATION_SECRET}
      - JWT_PRIVATE_KEY_B64=${JWT_PRIVATE_KEY_B64}
    volumes:
      - ./data/hub:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    ports:
      - "0.0.0.0:3016:3016"

  ruri-embed-server:
    # NOTE: This image is not publicly available on GHCR.
    # Build locally: docker build -t ruri-embed-server ./tools/ruri-embed-server
    # Or use any sentence-transformer compatible embedding server on port 8100.
    image: ruri-embed-server:v1.0.0-first-penguin
    restart: always
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        limits:
          memory: 2G

  timesfm-sidecar:
    build:
      context: ./apps/timesfm-sidecar
    restart: always
    environment:
      - TIMESFM_AUTH_TOKEN=${TIMESFM_AUTH_TOKEN}
    # RT3-7 FIX: No host port binding. Only accessible via Docker internal network.
    # Previous: ports: - "127.0.0.1:3020:3020"
    expose:
      - "3025"
    deploy:
      resources:
        limits:
          memory: 4G
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /home/appuser/.cache:size=2G
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"

  geo-optimizer:
    build:
      context: apps/geo-optimizer
      dockerfile: Dockerfile
    deploy: { resources: { limits: { memory: 1G } } }
    security_opt: ["no-new-privileges:true"]
    user: "1001:1001"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/openapi.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  shadow-worker:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: shadow-worker
    environment:
      - CELL_ID=${CELL_ID:-cell-0}
      - A2A_AUTH_TOKEN=${A2A_AUTH_TOKEN}
      - SHADOW_CLONE_GRPC_PORT=50051
      - OXILEAN_PROOF_TIMEOUT_SECS=${OXILEAN_PROOF_TIMEOUT_SECS:-10}
      - OXILEAN_PROOF_SEMAPHORE_PERMITS=${OXILEAN_PROOF_SEMAPHORE_PERMITS:-1}
      - KEY_PROXY_URL=http://key-proxy:9999
      - VAULT_SECRET=${VAULT_SECRET}
    expose:
      - "50051"
    depends_on:
      - key-proxy
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
