# Aiome Anti-Pattern Rules
# Enforced by scripts/pattern-enforcer.sh
# Format: Each rule has id, name, pattern (grep -E regex), severity, and path filters.
#
# Severity levels:
#   error   — CI fails (blocking)
#   warning — CI warns (non-blocking)
#
# Security: This file is read-only by the enforcer script.
# No code execution, no eval, no external dependencies.

rules:

  # ─── CRITICAL: SQLite Deadlock Prevention ───
  - id: AP-001
    name: "SwarmOps indirect call in do_* methods"
    description: "Use SwarmOps::do_* directly, not JobQueue trait methods"
    pattern: 'self\.(get_node_id|tick_local_clock|sign_swarm_payload)\('
    include: "karma.rs|guardrails.rs|oracle_ops.rs|evolution.rs"
    exclude: "mod.rs|tests.rs"
    severity: error
    adr: R-001

  # ─── CRITICAL: Recursive Async ───
  - id: AP-002
    name: "Recursive async call via Box::pin(self.do_same_fn)"
    description: "No recursive calls in async functions with SQLite transactions"
    pattern: 'Box::pin\(self\.do_[a-z_]+\(.*\)\)\.await'
    include: "swarm.rs"
    severity: warning
    adr: R-008

  # ─── HIGH: JSON Injection ───
  - id: AP-003
    name: "format! JSON construction"
    description: "Use serde_json::json! instead of format! for JSON"
    pattern: 'format!\(.*\{.*\".*:.*\".*\}'
    include: "*.rs"
    exclude: "tests.rs|test_*|*.md"
    severity: error
    adr: R-003

  # ─── HIGH: Silent Error Suppression ───
  - id: AP-004
    name: "Silent .ok() error suppression"
    description: "Don't suppress errors silently — at least log a warning"
    pattern: '\)\.await\.ok\(\);'
    include: "*.rs"
    exclude: "tests.rs|test_*"
    severity: error
    adr: R-004

  # ─── HIGH: Unwrap in Production ───
  - id: AP-005
    name: "unwrap/expect in production code"
    description: "Use proper error handling instead of unwrap/expect"
    pattern: '\.(unwrap|expect)\('
    include: "*.rs"
    exclude: "tests.rs|test_*|build.rs"
    severity: error
    adr: R-005

  # ─── MEDIUM: Hardcoded URLs ───
  - id: AP-006
    name: "Hardcoded localhost URL"
    description: "Use environment variables or config for URLs"
    pattern: 'http://(127\.0\.0\.1|localhost):[0-9]+'
    include: "*.rs"
    exclude: "tests.rs|test_*|*.md|*.yml|*.toml|*.json|*.example"
    severity: error
    adr: R-006

  # ─── MEDIUM: TODO/FIXME Tracker ───
  - id: AP-007
    name: "Unresolved TODO/FIXME/HACK/XXX"
    description: "Track unresolved items — not an error, just visibility"
    pattern: '(TODO|FIXME|HACK|XXX)(\(|:| )'
    include: "*.rs"
    exclude: "test_*"
    severity: info

  # ─── LOW: Missing Box::pin in JobQueue impl ───
  - id: AP-008
    name: "Direct do_ call without Box::pin in impl JobQueue"
    description: "All delegation methods must use Box::pin"
    pattern: '^\s+self\.do_[a-z_]+\('
    include: "mod.rs"
    severity: warning
    adr: R-002
