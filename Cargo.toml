[workspace]
members = [
    "apps/api-server",
    "apps/samsara-hub",
    "apps/key-proxy",
    "libs/core",
    "libs/infrastructure",
    "libs/shared",
    "libs/avatar-engine",
    "libs/wasm-skills/fs_reader",
    "libs/wasm-skills/terminal_exec",
    "libs/wasm-skills/fs_writer", "libs/napi-bridge",
    "apps/management-console/src-tauri",
    "apps/watchtower",
    "libs/aiome-contracts", "libs/soul", "apps/aiome-migrate", "apps/shadow-worker", "apps/aiome-node",
]
resolver = "2"

[workspace.dependencies]
aiome-contracts = { path = "libs/aiome-contracts" }
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "uuid", "chrono"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
config = "0.14"
schemars = "0.8"
unicode-normalization = "0.1"
nix = { version = "0.27", features = ["process", "signal", "user", "fs", "ptrace"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
secrecy = { version = "0.8", features = ["serde"] }
jsonschema = "0.17"
tower = { version = "0.4", features = ["limit"] }
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
automerge = "0.6"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
base64 = "0.22"
wiremock = "0.6"
rand = "0.8"
once_cell = "1.18"
serial_test = "3.1"
utoipa = { version = "5", features = ["chrono", "uuid"] }
sha2 = "0.10"
proptest = "1.6.0"
img_hash = "3.2"
image = "0.23"
stripe = { version = "0.41", package = "async-stripe", features = ["runtime-tokio-hyper-rustls"] }
hkdf = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
url = "2.5"
html-escape = "0.2"
lru = "0.13"
clap = { version = "4.5.4", features = ["derive"] }
indicatif = "0.17"
dotenvy = "0.15"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies.wasmtime]
version = "41.0.4"

[workspace.dependencies.wasmtime-wasi]
version = "41.0.4"
