[package]
name = "nurture-api"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
doctest = false

[dependencies]
shared = { path = "../../../libs/shared" }
aiome-core-contracts = { path = "../../../libs/aiome-core-contracts", features = ["grpc"] }
commerce-protocol = { path = "../../libs/commerce-protocol", features = ["axum"] }
nurture-core = { path = "../../libs/nurture-core" }
nurture-infra = { path = "../../libs/nurture-infra", default-features = false }
nurture-bridge = { path = "../../libs/nurture-bridge" }
axum = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
jsonwebtoken = { workspace = true }
tower = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "chrono"] }
anyhow = { workspace = true }
dotenvy = "0.15"
base64 = { workspace = true }
secrecy = { workspace = true }
tower-http = { version = "0.5", features = ["set-header", "limit", "timeout", "cors"] }
subtle = "2"
aws-config = { version = "1.8.16", optional = true }
aws-sdk-s3 = { version = "1.131.0", optional = true }
tonic = "0.12.3"
futures-util = "0.3.32"
async-stream = "0.3.6"

[features]
default = ["cloud-storage", "stripe"]
stripe = ["nurture-infra/stripe"]
cloud-storage = ["nurture-infra/cloud-storage", "dep:aws-config", "dep:aws-sdk-s3"]
desktop = ["stripe"]

[dev-dependencies]
axum-test = "16"
tempfile = "3"
serial_test = "3"
