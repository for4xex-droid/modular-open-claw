[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # OP-032（2026-07-22）: extism 1.30 → wasmtime 43。41.x / wasi-44 系 ignore は削除済。

    # rustls-webpki - 推移的依存 (aws-sdk, serenity 経由)
    "RUSTSEC-2026-0049", # CRL matching logic
    "RUSTSEC-2026-0098", # URI name constraints
    "RUSTSEC-2026-0099", # Wildcard name constraints  
    "RUSTSEC-2026-0104", # CRL parsing panic

    # Phase 2: Upstream / Unmaintained 依存の一時的許可
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained)
    "RUSTSEC-2024-0421", # idna (bastion-core 経由)
    "RUSTSEC-2024-0436", # paste (unmaintained)
    "RUSTSEC-2025-0017", # trust-dns-proto (bastion-core 経由)
    "RUSTSEC-2025-0057", # fxhash (unmaintained)
    "RUSTSEC-2025-0134", # rustls-pemfile (bastion-core 経由)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "BUSL-1.1",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
