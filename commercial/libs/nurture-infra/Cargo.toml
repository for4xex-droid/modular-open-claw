[package]
name = "nurture-infra"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[dependencies]
aiome-core-contracts = { path = "../../../libs/aiome-core-contracts" }
nurture-bridge = { path = "../nurture-bridge" }
commerce-protocol = { path = "../commerce-protocol" }
nurture-core = { path = "../nurture-core" }
sqlx = { workspace = true }
dashmap = { workspace = true }
chacha20poly1305 = { workspace = true }
reqwest = { workspace = true }
gltf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
secrecy = { workspace = true }
rand = { workspace = true }
async-stripe = { version = "1.0.0-rc.5", features = ["rustls-tls-webpki-roots", "rustls-aws-lc-rs"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
async-stripe-webhook = { workspace = true, optional = true }
sha2 = { workspace = true }
svix = "1.92.2"
http = "1.4.0"
hmac-sha256 = "1.1.14"
aws-config = { version = "1.8.16", optional = true }
aws-sdk-s3 = { version = "1.131.0", optional = true }
tokio-util = "0.7.18"

[features]
default = ["stripe", "cloud-storage"]
stripe = ["dep:async-stripe", "dep:async-stripe-webhook"]
cloud-storage = ["dep:aws-config", "dep:aws-sdk-s3"]
mock = []
