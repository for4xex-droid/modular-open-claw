version: '3.8'

services:
  # The AIOME Pro Command Center (With Nurture Features)
  api-server-pro:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: api-server
        FEATURES: nurture
    environment:
      - KEY_PROXY_URL=http://key-proxy:9999
      - SAMSARA_HUB_REST=http://samsara-hub:3016
      - SAMSARA_HUB_WS=ws://samsara-hub:3016/api/v1/federation/ws
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NURTURE_API_URL=http://nurture-api:3020
      - API_SERVER_SECRET=${API_SERVER_SECRET}
      - FEDERATION_SECRET=${FEDERATION_SECRET}
    depends_on:
      - key-proxy
      - samsara-hub
      - nurture-api
    restart: always
    ports:
      - "3015:3015"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nurture Commercial Engine
  nurture-api:
    build:
      context: ../Project-Nurture
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:///app/data/nurture.db
      - AIOME_API_URL=http://api-server-pro:3015
      - NURTURE_SECRET=${NURTURE_SECRET}
    volumes:
      - ./data/nurture:/app/data
    restart: always
    ports:
      - "3020:3020"

  # Standard OSS Services
  key-proxy:
    image: aiome-key-proxy:latest # Assuming pre-built or from main compose
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: key-proxy
    environment:
      - VAULT_SECRET=${VAULT_SECRET}
    cap_add:
      - IPC_LOCK
    restart: always

  samsara-hub:
    image: aiome-samsara-hub:latest
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      args:
        BIN_NAME: samsara-hub
    environment:
      - PORT=3016
      - DATABASE_URL=sqlite:///app/data/samsara_hub.db
      - FEDERATION_SECRET=${FEDERATION_SECRET}
    volumes:
      - ./data/hub:/app/data
    restart: always
